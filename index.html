<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11161b">
<meta name="app-version" content="2026.10.07-7">
<meta name="description" content="Cable machine workouts by day, with pulley-height diagrams, set logging and progress charts.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.update-bar { position: fixed; z-index: 30; left: 12px; right: 12px; top: calc(10px + env(safe-area-inset-top, 0px)); max-width: 520px; margin: 0 auto;
  display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; border-radius: 12px; background: var(--accent); color: var(--accent-ink);
  font-weight: 600; box-shadow: 0 6px 24px rgb(0 0 0 / .3); }
.update-bar span { flex: 1; min-width: 0; }
.update-bar button { border: 0; border-radius: 8px; padding: 10px 14px; min-height: 44px; background: var(--accent-ink); color: var(--accent); font: inherit; cursor: pointer; }
</style>
</head>
<body>
<!-- app:start (everything between the app markers is also published as the claude.ai artifact) -->
<title>Tension</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one column app shell. Sticky header with tabs, cards for exercises, a sheet for exercise detail. */
:root {
  --bg: #e9ecef;
  --surface: #f8f9fa;
  --surface-2: #dde2e7;
  --ink: #141d26;
  --muted: #56616d;
  --line: #c9d0d7;
  --accent: #f2b705;        /* weight-stack pin yellow, used as a fill */
  --accent-ink: #141d26;
  --cable: #c43d0c;         /* cable + motion path in diagrams */
  --fig: #1d2833;
  --fig-far: #8f9ba7;
  --good: #1f7a4d;
  --warn: #9a5b00;
  --font-display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161b; --surface: #192027; --surface-2: #232c35; --ink: #e5e9ed; --muted: #95a1ad;
    --line: #2f3a45; --accent: #f5c02b; --accent-ink: #141d26; --cable: #ff7a45; --fig: #e5e9ed;
    --fig-far: #5f6c79; --good: #4cc38a; --warn: #f0b44c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161b; --surface: #192027; --surface-2: #232c35; --ink: #e5e9ed; --muted: #95a1ad;
  --line: #2f3a45; --accent: #f5c02b; --accent-ink: #141d26; --cable: #ff7a45; --fig: #e5e9ed;
  --fig-far: #5f6c79; --good: #4cc38a; --warn: #f0b44c; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cable); outline-offset: 2px; }

[hidden] { display: none !important; }
.shell { max-width: 880px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
  margin-inline: -16px; padding-inline: 16px; padding-block: 12px 0;
}
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 28px; letter-spacing: .1em; text-transform: uppercase; margin: 0; line-height: 1; }
.brand h1 .logo { width: 28px; height: 28px; flex: none; fill: var(--fig); }
.brand h1 .logo .pin { fill: var(--accent); }
.save-status { font-size: 12px; color: var(--muted); }
nav.tabs { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; }
nav.tabs button {
  border: 0; background: none; padding: 8px 12px 10px; cursor: pointer; color: var(--muted);
  font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: .06em; text-transform: uppercase;
  border-bottom: 3px solid transparent; white-space: nowrap;
}
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; padding-top: 20px; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.05; margin: 0; text-wrap: balance; text-transform: uppercase; letter-spacing: .01em; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin: 0; letter-spacing: .02em; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }

.daychips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; cursor: pointer;
  font-size: 13px; font-weight: 600;
}
.chip-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip-btn { position: relative; }
.chip-btn.today::after { content: ""; position: absolute; top: 3px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--cable); }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink); white-space: nowrap; max-width: 100%; }
.pill.pulley { white-space: normal; border-radius: 8px; }
.pill.pulley { background: var(--accent); color: var(--accent-ink); }
.pill.done { background: var(--good); color: var(--bg); }
.ex-row.complete { border-color: color-mix(in srgb, var(--good) 70%, transparent); background: color-mix(in srgb, var(--good) 13%, var(--surface)); }
.ex-row.complete .order { color: var(--good); font-weight: 700; }
.day-progress { display: grid; gap: 6px; }
.day-progress .bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.day-progress .bar i { display: block; height: 100%; border-radius: inherit; background: var(--good); transition: width .3s ease; }
.day-progress .txt { font-size: 13px; font-weight: 600; color: var(--muted); }
.day-progress.all .txt { color: var(--good); }

/* Planned sets in the logger: grey until logged, green with a tick once done */
.slots { display: grid; gap: 6px; }
.slot { display: grid; grid-template-columns: 26px auto minmax(0, 1fr) 40px; align-items: center; gap: 10px; min-height: 48px; padding: 4px 4px 4px 10px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.slot .ck { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 15px; font-weight: 800; line-height: 1; }
.slot .lbl { font-weight: 600; white-space: nowrap; }
.slot .val { font-family: var(--font-mono); font-size: 15px; text-align: right; min-width: 0; }
.slot .val.todo { font-family: var(--font-body); font-size: 13px; color: var(--muted); }
.slot button { width: 40px; height: 40px; border: 0; border-radius: 8px; background: none; color: var(--muted); font-size: 15px; cursor: pointer; }
.slot.done { background: color-mix(in srgb, var(--good) 16%, var(--surface)); border-color: color-mix(in srgb, var(--good) 65%, transparent); }
.slot.done .ck { background: var(--good); border-color: var(--good); color: var(--bg); }
.slot.done .lbl { color: var(--good); }
.slot.next { border: 2px dashed var(--accent); }
.slot.next .ck { border-color: var(--accent); }
.logger.complete { border-color: color-mix(in srgb, var(--good) 65%, transparent); }

.ex-list { display: grid; gap: 10px; }
.ex-row {
  display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; cursor: pointer; width: 100%;
}
.ex-row .info { min-width: 0; display: grid; gap: 4px; }
.ex-row .title { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: baseline; }
.ex-row .name { font-weight: 600; font-size: 16px; line-height: 1.3; }
.ex-row .meta { font-size: 13px; color: var(--muted); }
.ex-row .order { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

.fig { display: block; width: 100%; height: auto; background: var(--surface-2); border-radius: 8px; }
.fig .floor { stroke: var(--muted); stroke-width: 2; }
.fig .tower { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.fig .tick { stroke: var(--line); stroke-width: 1.5; }
.fig .carriage { fill: var(--accent); stroke: var(--accent-ink); stroke-width: 1; }
.fig .pulley { fill: var(--surface); stroke: var(--fig); stroke-width: 2; }
.fig .guide { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 3 5; opacity: .9; }
.fig .cable { stroke: var(--cable); stroke-width: 2; }
.fig .handle { fill: var(--surface); stroke: var(--cable); stroke-width: 2.5; stroke-linejoin: round; }
.fig .bar-end { fill: var(--fig); stroke: var(--cable); stroke-width: 2.5; }
.fig .strand { stroke: var(--cable); stroke-width: 3; stroke-linecap: round; }
.fig .ball { fill: var(--cable); }

/* Logging a past day, records, workout summary */
.date-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.date-row input[type="date"] { min-height: 40px; min-width: 0; padding: 6px 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; font-weight: 600; }
.date-row .icon-btn { width: 40px; height: 40px; font-size: 22px; border: 1px solid var(--line); }
.date-row .icon-btn:disabled { opacity: .35; cursor: default; }
.past-note { font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 8px; color: var(--ink);
  background: color-mix(in srgb, var(--accent) 20%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent); }
.btn.finish { width: 100%; min-height: 50px; font-size: 16px; }
.pr { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); font: 700 11px/1.4 var(--font-body); letter-spacing: .06em; vertical-align: 1px; }
.sum-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.records, .sum-list { display: grid; gap: 6px; }
.cal-card { display: grid; gap: 6px; padding: 12px 14px; border-radius: var(--r); border: 1px solid color-mix(in srgb, var(--cable) 50%, transparent);
  background: color-mix(in srgb, var(--cable) 12%, var(--surface)); }
.cal-card .cal-v { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.cal-card .cal-v b { font-family: var(--font-display); font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.cal-card .cal-v span { font-weight: 600; }
.cal-card .s { font-size: 13px; color: var(--muted); }
.bw-row { display: flex; align-items: center; gap: 8px; }
.bw-row input { width: 96px; min-height: 40px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; font-family: var(--font-mono); font-size: 16px; }
.record { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px;
  background: color-mix(in srgb, var(--accent) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); }
.record .nm, .sum-ex .nm { font-weight: 600; }
.record .s, .sum-ex .s { font-size: 14px; color: var(--muted); }
.record b { color: var(--ink); font-family: var(--font-mono); }
.sum-ex { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.sum-ex .ck { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 15px; font-weight: 800; line-height: 1; }
.sum-ex.ok { background: color-mix(in srgb, var(--good) 14%, var(--surface)); border-color: color-mix(in srgb, var(--good) 60%, transparent); }
.sum-ex.ok .ck { background: var(--good); border-color: var(--good); color: var(--bg); }
.sum-ex.skip { opacity: .65; }
.hist-day .hd { display: flex; align-items: center; gap: 8px; }
.hist-day .hd .d { margin-right: auto; }

/* Muscle map + muscle chips */
.musc { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.musc .mm { width: 116px; height: auto; display: block; }
.musc-info { display: grid; gap: 6px; min-width: 0; }
.mchips { display: flex; flex-wrap: wrap; gap: 6px; }
.mchip { display: inline-flex; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; line-height: 1.35; }
.mchip.p { background: var(--cable); color: var(--bg); }
.mchip.s { border: 1px solid color-mix(in srgb, var(--cable) 55%, transparent); color: var(--ink); padding: 2px 9px; }
.musc .focus { font-size: 13px; color: var(--muted); }
.mkey { display: flex; gap: 12px; font-size: 12px; color: var(--muted); }
.mkey i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.mkey i.p { background: var(--cable); }
.mkey i.s { background: color-mix(in srgb, var(--cable) 42%, var(--surface-2)); }
.mm .n { fill: var(--surface-2); stroke: var(--line); stroke-width: .8; }
.mm .base { fill: color-mix(in srgb, var(--surface-2) 70%, var(--bg)); stroke: var(--line); stroke-width: .8; }
.mm .p { fill: var(--cable); stroke: color-mix(in srgb, var(--cable) 70%, #000); stroke-width: .6; }
.mm .s { fill: color-mix(in srgb, var(--cable) 42%, var(--surface-2)); stroke: var(--line); stroke-width: .6; }
.mline { font-size: 13px; color: var(--muted); }
.mline b { color: var(--ink); font-weight: 600; }

/* Attachment drawings */
.gear-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.gear-card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.gear-card svg { width: 100%; height: auto; max-height: 96px; }
.gear-card .nm { font-weight: 600; }
.gear-card .s { font-size: 12px; color: var(--muted); }
.gear-or { align-self: center; justify-self: center; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.gear-pick { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
.gear-pick .gear-card { flex: 1 1 180px; }
.gm { fill: none; stroke: var(--fig); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.gk { fill: none; stroke: var(--fig); stroke-width: 11; stroke-dasharray: 1.5 2.5; }
.gc { stroke: var(--muted); stroke-width: 2; }
.gclip { fill: none; stroke: var(--fig); stroke-width: 2.5; }
.grope { fill: none; stroke: var(--fig); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 5 2; }
.gball, .ggrip { fill: var(--fig); }
.fig .trail { fill: none; stroke: var(--cable); stroke-width: 1.5; stroke-dasharray: 2 4; opacity: .75; }
.fig .arrow { fill: var(--cable); }
.fig .limb { fill: none; stroke: var(--fig); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
.fig .limb.far { stroke: var(--fig-far); }
.fig .torso { fill: none; stroke: var(--fig); stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
.fig .torso-f { fill: var(--fig); stroke: var(--fig); stroke-width: 6; stroke-linejoin: round; }
.fig .head { fill: var(--fig); }
.fig .lbl { fill: var(--muted); font: 600 10px var(--font-body); letter-spacing: .06em; text-transform: uppercase; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.grid-lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.lib-card { display: grid; gap: 8px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; cursor: pointer; }
.lib-card .name { font-weight: 600; }
.lib-card .meta { font-size: 13px; color: var(--muted); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--cable); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.icon-btn { border: 0; background: none; cursor: pointer; padding: 4px 8px; color: var(--muted); font-size: 16px; line-height: 1; border-radius: 6px; }

.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 24px; text-align: center; color: var(--muted); }
.rest { padding: 32px 20px; }
.rest h3 { color: var(--ink); margin-bottom: 6px; }

/* Detail sheet */
dialog.sheet { overflow-y: auto; overscroll-behavior: contain; border: 0; padding: 0; width: min(760px, 100%); max-height: 100%; background: var(--bg); color: var(--ink); border-radius: 14px; }
dialog.sheet::backdrop { background: rgb(0 0 0 / .5); }
.sheet-inner { padding: 18px 16px 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.sheet-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.fig-wrap { display: grid; gap: 8px; }
#sheetFig .fig { max-height: 46vh; }
.demo { justify-self: start; font-weight: 600; font-size: 14px; color: var(--ink); text-decoration: underline; text-decoration-color: var(--cable); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.fig-ctrl { display: flex; gap: 12px; align-items: center; }
.scrub { flex: 1; min-width: 0; display: grid; gap: 2px; }
.scrub input[type="range"] { width: 100%; min-width: 0; margin: 0; accent-color: var(--cable); }
.scrub-ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 10px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.fact .k { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.fact .v { font-weight: 600; }
.fact .s { font-size: 13px; color: var(--muted); }
.fact.pulley-fact { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.fact.pulley-fact .k, .fact.pulley-fact .s { color: var(--accent-ink); opacity: .8; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.cols > div { min-width: 0; }
ol.steps, ul.cues { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 4px; }
.note-input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; }

.logger { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; }
.log-form { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
.log-form label { min-width: 0; display: grid; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted); }
.log-form input { width: 96px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; font-family: var(--font-mono); font-size: 16px; }
.stepper { display: flex; align-items: center; gap: 2px; }
.stepper button { width: 34px; height: 40px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; cursor: pointer; font-weight: 700; }
.sets { display: flex; gap: 6px; flex-wrap: wrap; }
.set-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 4px 4px 10px; border-radius: 999px; background: var(--surface-2); font-family: var(--font-mono); font-size: 13px; }
.set-chip button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 6px; font-size: 14px; }
.hint { font-size: 14px; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); }
.hint b { font-family: var(--font-mono); }

/* Plan editor */
.plan-day { display: grid; gap: 10px; }
.plan-day .day-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.plan-day .day-head input { flex: 1; min-width: 140px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; font-weight: 600; }
.plan-item { display: grid; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
.pi-top { display: flex; gap: 8px; align-items: flex-start; }

const L = { torso: 50, neck: 9, head: 11, ua: 30, fa: 27, th: 44, sh: 44, foot: 11 };

/* ============================================================
   Storage: per-person cloud store when available, else this browser
   ============================================================ */
const LS_KEY = "cable-workout-log-v1";   // keep: renaming this would lose saved workouts
const Store = {
  mode: "loading", db: null, uid: null,
  state: { units: "lb", plan: clone(DEFAULT_PLAN), notes: {}, rest: 90, beep: true, planVersion: 3 },
  logs: {},
  timers: {}, chains: {},
  async init() {
    let db = null, user = null;
    if (window.claude && typeof window.claude.use === "function") {
      try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) { db = null; }
    }
    const uid = user ? await user.id() : null;
    if (db && uid) {
      try {
        const snap = await db.collection("data/users/" + uid).get();
        for (const doc of snap.docs) {
          const data = doc.data();
          if (doc.id === "state") this.state = normalizeState(data);
          else if (doc.id.startsWith("log-")) this.logs[doc.id.slice(4)] = clone(data);
        }
        this.db = db; this.uid = uid; this.mode = "cloud";
        return;
      } catch (e) { /* fall through to local */ }
    }
    this.mode = "local";
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) { const o = JSON.parse(raw); this.state = normalizeState(o.state || {}); this.logs = o.logs || {}; }
    } catch (e) { this.mode = "memory"; }
  },
  saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ state: this.state, logs: this.logs })); }
    catch (e) { this.mode = "memory"; updateStatus(); }
  },
  write(docId, body) {
    if (this.mode !== "cloud") { this.saveLocal(); return; }
    clearTimeout(this.timers[docId]);
    setStatus("Saving…");
    this.timers[docId] = setTimeout(() => {
      const ref = this.db.doc("data/users/" + this.uid + "/" + docId);
      const job = () => (body() ? ref.set(body()) : ref.delete());
      this.chains[docId] = (this.chains[docId] || Promise.resolve())
        .then(job)
        .then(() => setStatus("Saved"))
        .catch(err => {
          setStatus("Not saved");

        });
    }, 500);
  },
  saveState() { this.write("state", () => clone(this.state)); },
  saveLog(date) {
    const log = this.logs[date];
    if (log && !Object.keys(log.sets).length) delete this.logs[date];

function normalizeState(s) {

    if (!day || !Array.isArray(day.items)) continue;
    const seen = new Set();
    day.items = day.items.map(x => (x.id in RETIRED ? (RETIRED[x.id] ? { ...x, id: RETIRED[x.id] } : null) : x))
      .filter(x => x && EXMAP[x.id] && !seen.has(x.id) && seen.add(x.id));

  // so slide Fri -> Thu and Sat -> Fri, keeping any edits.

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function drawChart() {
  const box = document.getElementById("chartBox"); if (!box || !ui.chartEx) return;
  const pts = Object.keys(Store.logs).sort().map(d => ({ d, s: setsOn(d, ui.chartEx) })).filter(x => x.s.length)
    .map(x => ({ d: x.d, top: Math.max(...x.s.map(s => s.w)), est: Math.max(...x.s.map(s => e1rm(s.w, s.r))) }));
  const W = Math.max(260, Math.round(box.clientWidth || 640)), H = Math.round(Math.min(240, Math.max(180, W * 0.5))), ml = 40, mr = 14, mt = 14, mb = 28;
  const lo0 = Math.min(...pts.map(p => p.top)), hi0 = Math.max(...pts.map(p => p.est));
  const span = Math.max(hi0 - lo0, 1);
  const step = [1, 2, 2.5, 5, 10, 20, 25, 50, 100].find(s => span / s <= 5) || 100;
  const lo = Math.max(0, Math.floor((lo0 - span * 0.1) / step) * step), hi = Math.ceil((hi0 + span * 0.1) / step) * step;
  const x = i => pts.length === 1 ? (ml + W - mr) / 2 : ml + (W - ml - mr) * i / (pts.length - 1);
  const y = v => mt + (H - mt - mb) * (1 - (v - lo) / (hi - lo));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Heaviest set per workout">`;
  for (let v = lo; v <= hi + 1e-9; v += step) s += `<line class="gridl" x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${ml - 8}" y="${y(v) + 4}" text-anchor="end">${fmtW(v)}</text>`;
  const idx = pts.length <= 4 ? pts.map((_, i) => i) : [0, Math.round((pts.length - 1) / 2), pts.length - 1];
  for (const i of idx) s += `<text class="axis" x="${x(i)}" y="${H - 8}" text-anchor="${pts.length === 1 ? "middle" : i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle"}">${fmtDate(pts[i].d, { month: "short", day: "numeric" })}</text>`;
  const line = k => pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[k]).toFixed(1)}`).join("");
  if (pts.length > 1) s += `<path class="area" d="${line("top")}L${x(pts.length - 1)},${H - mb}L${x(0)},${H - mb}Z"/>`;
  s += `<path class="l2" d="${line("est")}"/><path class="l1" d="${line("top")}"/>`;
  pts.forEach((p, i) => { s += i === pts.length - 1 ? `<circle class="end" cx="${x(i)}" cy="${y(p.top)}" r="5"/>` : `<circle class="dot" cx="${x(i)}" cy="${y(p.top)}" r="3"/>`; });
  const lp = pts[pts.length - 1];
  s += `</svg><div class="muted" style="font-size:13px">Latest: <span class="num">${fmtW(lp.top)} ${unit()}</span> heaviest set, about <span class="num">${fmtW(Math.round(lp.est))} ${unit()}</span> estimated 1-rep max.${pts.length > 1 ? ` Change since first workout: <span class="num">${lp.top - pts[0].top >= 0 ? "+" : ""}${fmtW(lp.top - pts[0].top)} ${unit()}</span>.` : ""}</div>`;
  box.innerHTML = s;
}

/* Calories: MET x body weight (kg) x hours. Resistance training with several exercises at
   8-15 reps is 3.5 METs in the 2024 Adult Compendium of Physical Activities. Time is the
   measured span of the workout plus a minute for the last set; back-filled days have no
   timestamps, so their time is estimated from the sets and the rest timer setting. */
const MET_RESISTANCE = 3.5;
function workoutTime(date) {
  const all = Object.values(Store.logs[date]?.sets || {}).flat();
  const ts = all.map(x => x.t).filter(t => t && dateKey(new Date(t)) === date);
  if (ts.length > 1) return { mins: Math.max(1, Math.round((Math.max(...ts) - Math.min(...ts)) / 60000)) + 1, measured: true };
  return all.length ? { mins: Math.max(1, Math.round((all.length * ((Store.state.rest || 90) + 40)) / 60)), measured: false } : null;
}
function caloriesFor(date) {
  const bw = Store.state.bodyWeight, time = workoutTime(date);
  if (!bw || !time) return null;
  const kg = unit() === "kg" ? bw : bw * 0.45359237;
  return { kcal: Math.round(MET_RESISTANCE * kg * (time.mins / 60)), ...time, bw };
}
function openSummary() {
  ui.sheetMode = "summary";

}

        <div class="scrub"><input type="range" id="scrub" min="0" max="100" value="0" aria-label="Scrub through the movement"><div class="scrub-ends" aria-hidden="true"><span>Start</span><span>Finish</span></div></div>
      </div>
      <a class="demo" href="https://www.youtube.com/results?search_query=${encodeURIComponent(ex.name + " cable exercise proper form")}" target="_blank" rel="noopener">Watch a demo on YouTube ↗</a>
    </div>
    <div class="facts">
      <div class="fact pulley-fact"><div class="k">Pulley height</div><div class="v">${lvl.name}</div><div class="s">${lvl.where}</div></div>
      <div class="fact"><div class="k">Where you stand</div><div class="v" style="font-weight:500">${esc(ex.position)}</div></div>
    </div>
    ${muscleBlock(ex.p, ex.s, "Muscles worked", FOCUS[ex.id] || "")}
    <section class="logger ${today.length >= item.sets ? "complete" : ""}" aria-label="Log sets">
      ${isLogToday() ? "" : `<div class="past-note">Logging for ${fmtDate(logKey(), { weekday: "long", month: "short", day: "numeric" })}</div>`}
      <div class="row" style="justify-content:space-between"><h3>Log ${isLogToday() ? "today" : fmtDate(logKey())}</h3>${today.length >= item.sets
        ? `<span class="pill done">✓ Done</span>` : `<span class="pill">${today.length}/${item.sets} sets · ${item.min}–${item.max} reps</span>`}</div>
      <div class="muted" style="font-size:13px">Log the number on the weight-stack pin. The Arcadia is 2:1, so the cable feels like about half of that.</div>
      <div class="hint">${sug.text}${last ? ` <span class="muted">Last time: <span class="num">${last.sets.map(s => `${fmtW(s.w)}×${s.r}`).join(", ")}</span></span>` : ""}</div>
      <form class="log-form" id="logForm">
        <label>Weight (${unit()})<span class="stepper"><button type="button" data-step="w:-1" aria-label="Less weight">−</button><input id="wIn" type="number" inputmode="decimal" step="any" min="0" value="${prefillW}" required><button type="button" data-step="w:1" aria-label="More weight">+</button></span></label>
        <label>Reps<span class="stepper"><button type="button" data-step="r:-1" aria-label="Fewer reps">−</button><input id="rIn" type="number" inputmode="numeric" min="1" max="100" value="${prefillR}" required><button type="button" data-step="r:1" aria-label="More reps">+</button></span></label>
        <button class="btn primary" type="submit">Log set</button>
      </form>
      <div class="rest-bar" data-restbar hidden><div class="rest-fill"></div><span class="lbl">Rest</span><b class="rest-time">1:30</b><button type="button" data-rest="-15" aria-label="15 seconds less">−15</button><button type="button" data-rest="15" aria-label="15 seconds more">+15</button><button type="button" data-rest="skip">Skip</button></div>
      <div class="slots" aria-label="Sets">${Array.from({ length: Math.max(item.sets, today.length) }, (_, i) => {
        const st = today[i];
        if (st) return `<div class="slot done"><span class="ck" aria-hidden="true">✓</span><span class="lbl">Set ${i + 1}</span><span class="val">${i === prIndex ? `<span class="pr" title="Personal record">PR</span> ` : ""}${fmtW(st.w)} ${unit()} × ${st.r}</span><button data-delset="${i}" aria-label="Delete set ${i + 1}">✕</button></div>`;
        return `<div class="slot ${i === today.length ? "next" : ""}"><span class="ck" aria-hidden="true"></span><span class="lbl">Set ${i + 1}</span><span class="val todo">${i === today.length ? "Up next · " : ""}${item.min}–${item.max} reps</span><span></span></div>`;
      }).join("")}</div>
      ${workoutNav(ex.id)}
    </section>
    <section class="stack" style="gap:8px" aria-label="Attachment">
      <div class="eyebrow">Clip on${ex.gear.length > 1 ? " either" : ""}${ex.gear[0] === "dhandle" && (ex.pair || ex.machine === "both") ? " · one on each cable" : ""}</div>
      <div class="gear-pick">${ex.gear.map(g => gearCard(g)).join('<span class="gear-or">or</span>')}</div>
    </section>
    <div class="stack" style="gap:6px">
      <label for="noteInput" class="eyebrow">Setting on your machine</label>
      <input id="noteInput" class="note-input" maxlength="40" placeholder="e.g. position 6 of 32" value="${esc(Store.state.notes[ex.id] || "")}">
    </div>
    <div class="cols">
      <div><h3>Setup</h3><ol class="steps">${ex.setup.map(s => `<li>${esc(s)}</li>`).join("")}</ol></div>
      <div><h3>The movement</h3><ol class="steps">${ex.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol></div>
      <div><h3>Cues</h3><ul class="cues">${ex.cues.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>
      <div><h3>Common mistakes</h3><ul class="cues">${ex.mistakes.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>
    </div>`;
  const wasManual = sheetDiagram ? sheetDiagram.manual : reduceMotion.matches;
  sheetDiagram = makeDiagram(ex, { manual: wasManual });
  document.getElementById("sheetFig").appendChild(sheetDiagram.svg);
  const scrub = document.getElementById("scrub");
  sheetDiagram.onFrame = k => { scrub.value = Math.round(k * 100); };
  document.getElementById("playBtn").textContent = sheetDiagram.manual ? "Play" : "Pause";
  scrub.value = Math.round(sheetDiagram.k * 100);
  paintRest();
}

/* ============================================================
   Rest timer + keep the screen on while training
   ============================================================ */
const rest = { end: 0, dur: 0, iv: null };
function startRest(sec) {
  rest.dur = sec; rest.end = Date.now() + sec * 1000;
  clearInterval(rest.iv); rest.iv = setInterval(paintRest, 250);
  paintRest(); keepAwake(true);
}
// Sound needs a tap first, so the audio is unlocked when a set is logged.
let audio = null;
function unlockAudio() {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); } catch (e) { audio = null; }
}
function beep() {
  if (!audio || Store.state.beep === false) return;
  const t = audio.currentTime;
  [0, 0.22, 0.44].forEach((d, i) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = "sine"; o.frequency.value = i === 2 ? 1175 : 880;
    g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(0.35, t + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.18);
    o.connect(g).connect(audio.destination); o.start(t + d); o.stop(t + d + 0.2);
  });
}
function stopRest(finished) {
  clearInterval(rest.iv); rest.end = 0; paintRest();
  if (finished) {
    beep();
    try { navigator.vibrate && navigator.vibrate([250, 120, 250, 120, 400]); } catch (e) {}
    document.body.classList.remove("rest-done"); void document.body.offsetWidth; document.body.classList.add("rest-done");
    setTimeout(() => document.body.classList.remove("rest-done"), 1600);
    toast("Rest's over. Next set!");
  }
  if (!sheet.open) keepAwake(false);
}
function paintRest() {
  const left = Math.max(0, rest.end - Date.now()), on = rest.end > 0;
  const sec = Math.ceil(left / 1000), txt = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
  document.getElementById("restBar").hidden = !on || sheet.open;
  document.querySelectorAll("[data-restbar]").forEach(b => (b.hidden = !on));
  document.querySelectorAll(".rest-time").forEach(t => (t.textContent = txt));
  document.querySelectorAll(".rest-fill").forEach(f => (f.style.width = (on ? (left / (rest.dur * 1000)) * 100 : 0) + "%"));
  if (on && left <= 0) stopRest(true);
}
function restAction(a) {
  if (a === "skip") return stopRest(false);
  rest.end = Math.max(Date.now() + 1000, rest.end + +a * 1000); rest.dur = Math.max(rest.dur + +a, 1); paintRest();
}
document.getElementById("restBar").addEventListener("click", e => { const b = e.target.closest("[data-rest]"); if (b) restAction(b.dataset.rest); });

let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => (wakeLock = null)); }
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { if (sheet.open || rest.end) keepAwake(true); paintRest(); }
});

/* ============================================================
   Events
   ============================================================ */
/* Back button. Today is the bottom of the history stack, another tab sits on top of it,
   and an open exercise on top of that. So back closes the exercise, then returns to
   Today, and only leaves the app from Today. */
const hist = {
  push(state) { try { history.pushState(state, ""); } catch (e) {} },
  replace(state) { try { history.replaceState(state, ""); } catch (e) {} },
};
function showTab(tab) {
  ui.tab = tab; ui.confirm = null;
  try { localStorage.setItem(LS_KEY + ":tab", tab); } catch (err) {}
  render(); window.scrollTo(0, 0);
}
document.querySelector("nav.tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if (!b || b.dataset.tab === ui.tab) return;
  const to = b.dataset.tab;
  if (ui.tab === "today") hist.push({ tab: to });
  else if (to === "today") {
    if (history.state && history.state.tab === ui.tab) { history.back(); return; }   // popstate shows Today
    hist.replace({ tab: "today" });
  }
  else hist.replace({ tab: to });
  showTab(to);
});
window.addEventListener("popstate", e => {
  const st = e.state || { tab: "today" };
  if (sheet.open && !st.sheet) sheet.close();
  if (st.sheet && !sheet.open) hist.replace({ tab: st.tab || "today" });   // forward into a closed exercise
  if (st.tab && st.tab !== ui.tab) showTab(st.tab);
});

const view = document.getElementById("view");
view.addEventListener("click", e => {
  const t = e.target.closest("button, [data-open]"); if (!t) return;
  const ds = t.dataset;
  if (ds.open) {
    ui.sheetList = ds.ctx === "today" ? (Store.state.plan[ui.day]?.items || []).map(x => x.id).filter(id => EXMAP[id]) : null;
    return openSheet(ds.open);
  }
  if (ds.restdef) { Store.state.rest = +ds.restdef; Store.saveState(); return render(); }
  if (ds.beep) { Store.state.beep = ds.beep === "on"; Store.saveState(); if (Store.state.beep) { unlockAudio(); beep(); } return render(); }
  if (ds.day) { ui.day = ds.day; return render(); }
  if (ds.shift) { setLogDate(shiftKey(logKey(), +ds.shift)); return render(); }
  if (ds.edit) {
    setLogDate(ds.edit);
    if (ui.tab !== "today" && history.state && history.state.tab === ui.tab) { history.back(); return; }   // popstate shows Today
    return showTab("today");
  }
  if (ds.group) { ui.group = ds.group; return render(); }
  const plan = Store.state.plan;
  if (ds.add) {
    const sel = document.getElementById("add-" + ds.add);
    plan[ds.add] = plan[ds.add] || { title: "", items: [] };
    plan[ds.add].items.push({ ...planItemFor(sel.value), id: sel.value });
    if (!plan[ds.add].title || plan[ds.add].title === "Rest") plan[ds.add].title = "Workout";
    Store.saveState(); return render();
  }
  if (ds.remove) { const [d, i] = ds.remove.split(":"); plan[d].items.splice(+i, 1); Store.saveState(); return render(); }
  if (ds.move) { const [d, i, dir] = ds.move.split(":"); const a = plan[d].items, j = +i + +dir; [a[i], a[j]] = [a[j], a[i]]; Store.saveState(); return render(); }
  if (ds.units) { Store.state.units = ds.units; Store.saveState(); return render(); }
  switch (ds.act) {
    case "reset": ui.confirm = "reset"; return render();
    case "reset-yes": Store.state.plan = clone(DEFAULT_PLAN); ui.confirm = null; Store.saveState(); toast("Plan reset to the starter plan"); return render();
    case "cancel": ui.confirm = null; return render();
    case "export": return exportData();
    case "import-yes": return applyImport();
    case "today": setLogDate(null); return render();
    case "finish": return openSummary();
  }
});
view.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.pi) {
    const [d, i, f] = t.dataset.pi.split(":"); const item = Store.state.plan[d].items[+i];
    const v = Math.max(1, Math.min(50, parseInt(t.value, 10) || 1)); item[f] = v;
    if (item.min > item.max) { if (f === "min") item.max = item.min; else item.min = item.max; }
    Store.saveState(); return render();
  }
  if (t.dataset.title) { Store.state.plan[t.dataset.title].title = t.value.trim().slice(0, 40); Store.saveState(); return; }
  if (t.id === "chartEx") { ui.chartEx = t.value; return drawChart(); }
  if (t.id === "logDate") { setLogDate(t.value || null); return render(); }
  if (t.id === "bwSet") { const v = parseFloat(t.value); Store.state.bodyWeight = v > 0 && v < 1000 ? v : null; Store.saveState(); return; }
  if (t.id === "importFile" && t.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const o = JSON.parse(r.result);
        if (!o || typeof o !== "object" || !o.logs || !o.state) throw 0;
        ui.confirm = { import: { data: o, days: Object.keys(o.logs).length } }; render();
      } catch (err) { toast("That file isn't a Tension backup."); }
    };
    r.readAsText(t.files[0]);
  }
});

async function exportData() {
  const data = JSON.stringify({ app: "tension", version: 1, exported: new Date().toISOString(), state: Store.state, logs: Store.logs }, null, 2);
  const filename = `tension-backup-${todayKey()}.json`;
  let dl = null;
  if (window.claude && typeof window.claude.use === "function") { try { dl = await window.claude.use("downloads"); } catch (e) {} }
  if (dl) {
    try { await dl.save({ filename, data }); } catch (e) { if (e && e.code !== "declined") toast("Couldn't save the backup file here."); }
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}
function applyImport() {
  const o = ui.confirm.import.data; ui.confirm = null;
  const old = Object.keys(Store.logs);
  Store.state = normalizeState(o.state); Store.logs = {};
  for (const [d, log] of Object.entries(o.logs)) if (/^\d{4}-\d{2}-\d{2}$/.test(d) && log && log.sets) Store.logs[d] = { date: d, sets: log.sets, ...(log.title ? { title: log.title } : {}) };
  Store.saveState();
  for (const d of new Set([...old, ...Object.keys(Store.logs)])) Store.saveLog(d);
  toast("Backup imported"); render();
}

const sheet = document.getElementById("sheet");
sheet.addEventListener("click", e => {
  if (e.target === sheet) return sheet.close();
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.act === "close") return sheet.close();
  if (t.dataset.act === "finish") return openSummary();
  if (t.dataset.act === "savebw") {
    const v = parseFloat(document.getElementById("bwIn").value);
    if (!(v > 0 && v < 1000)) { toast(`Enter your body weight in ${unit()}.`); return; }
    Store.state.bodyWeight = v; Store.saveState(); renderSheet(); return;
  }
  if (t.dataset.goto) { sheetEx = EXMAP[t.dataset.goto]; ui.sheetMode = "exercise"; renderSheet(); sheet.scrollTop = 0; return; }
  if (t.dataset.rest) return restAction(t.dataset.rest);
  if (t.dataset.act === "play") {
    sheetDiagram.manual = !sheetDiagram.manual; t.textContent = sheetDiagram.manual ? "Play" : "Pause";
    if (!sheetDiagram.manual && reduceMotion.matches) {
      // Reduced motion: step through manually instead of looping.
      sheetDiagram.manual = true; t.textContent = "Play";
      const target = sheetDiagram.k < 0.5 ? 1 : 0; drawDiagram(sheetDiagram, target); document.getElementById("scrub").value = target * 100;
    }
    return;
  }
  if (t.dataset.step) {
    const [f, dir] = t.dataset.step.split(":"); const inp = document.getElementById(f === "w" ? "wIn" : "rIn");
    const cur = parseFloat(inp.value) || 0; const nv = Math.max(f === "w" ? 0 : 1, cur + (+dir) * (f === "w" ? inc() : 1));
    inp.value = fmtW(nv); return;
  }
  if (t.dataset.delset !== undefined) {
    const d = logKey(); setsOn(d, sheetEx.id).splice(+t.dataset.delset, 1);
    if (!setsOn(d, sheetEx.id).length && Store.logs[d]) delete Store.logs[d].sets[sheetEx.id];
    Store.saveLog(d); renderSheet(); render(); return;
  }
});
sheet.addEventListener("close", () => {
  paintRest(); if (!rest.end) keepAwake(false);
  if (history.state && history.state.sheet) history.back();   // closed with ✕, Finish or Esc: drop its history entry
});
sheet.addEventListener("input", e => {
  if (e.target.id === "scrub") { sheetDiagram.manual = true; document.getElementById("playBtn").textContent = "Play"; drawDiagram(sheetDiagram, e.target.value / 100); }
});
sheet.addEventListener("change", e => {
  if (e.target.id === "noteInput") {
    const v = e.target.value.trim().slice(0, 40);
    if (v) Store.state.notes[sheetEx.id] = v; else delete Store.state.notes[sheetEx.id];
    Store.saveState(); render();
  }
});
sheet.addEventListener("submit", e => {
  e.preventDefault();
  const w = parseFloat(document.getElementById("wIn").value), r = parseInt(document.getElementById("rIn").value, 10);
  if (!(w >= 0) || !(r >= 1)) { toast("Enter a weight and at least 1 rep."); return; }
  const d = logKey();
  const prev = bestBefore(sheetEx.id, d), before = setsOn(d, sheetEx.id);
  const topSoFar = before.length ? Math.max(...before.map(x => x.w)) : -1;
  Store.logs[d] = Store.logs[d] || { date: d, sets: {} };
  if (!Store.logs[d].title) Store.logs[d].title = (Store.state.plan[ui.day] || {}).title || "";
  (Store.logs[d].sets[sheetEx.id] = Store.logs[d].sets[sheetEx.id] || []).push({ w, r, t: Date.now() });
  Store.saveLog(d);
  const n = setsOn(d, sheetEx.id).length, target = planItemFor(sheetEx.id).sets;
  if (prev && w > prev.w && w > topSoFar) toast(`New record: ${fmtW(w)} ${unit()} on ${sheetEx.name}, up from ${fmtW(prev.w)}`);
  else toast(n === target ? `✓ ${sheetEx.name}: all ${target} sets done` : n > target ? `Extra set ${n} logged` : `Set ${n} of ${target} done`);
  renderSheet(); render();
  unlockAudio();
  startRest(Store.state.rest || 90);
});

/* ============================================================
   Boot
   ============================================================ */
// Start with Today at the bottom of the history stack, so back from any tab returns to it.
// After a reload the stack already exists; just pick up where it was (minus an open exercise).
if (history.state && history.state.tab) {
  ui.tab = history.state.tab;
  if (history.state.sheet) hist.replace({ tab: ui.tab });
} else {
  hist.replace({ tab: "today" });
  if (ui.tab !== "today") hist.push({ tab: ui.tab });
}
render();
Store.init().then(() => { updateStatus(); render(); });
</script>
<!-- app:end -->
<div class="update-bar" id="updateBar" hidden role="status"><span>A new version of Tension is ready.</span><button type="button" id="updateBtn">Update</button></div>
<script>
// Installable app: offline cache, and ask the browser not to clear saved workouts.
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
document.addEventListener("submit", e => {
  if (e.target.id !== "logForm" || !(navigator.storage && navigator.storage.persist)) return;
  navigator.storage.persisted().then(p => p || navigator.storage.persist()).catch(() => {});
}, { capture: true });

// Updates: when the app is opened again, check whether a newer version is online and offer it.
async function checkForUpdate() {
  if (location.protocol === "file:" || !navigator.onLine) return;
  try {
    const html = await (await fetch("./", { cache: "no-store" })).text();
    const latest = (html.match(/<meta name="app-version" content="([^"]+)"/) || [])[1];
    if (latest && latest !== APP_VERSION) document.getElementById("updateBar").hidden = false;
  } catch (e) {}
}
document.getElementById("updateBtn").addEventListener("click", () => location.reload());
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkForUpdate(); });
setTimeout(checkForUpdate, 3000);
</script>
</body>
