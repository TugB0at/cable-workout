<title>Cable Workout Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one column app shell. Sticky header with tabs, cards for exercises, a sheet for exercise detail. */
:root {
  --bg: #e9ecef;
  --surface: #f8f9fa;
  --surface-2: #dde2e7;
  --ink: #141d26;
  --muted: #56616d;
  --line: #c9d0d7;
  --accent: #f2b705;        /* weight-stack pin yellow, used as a fill */
  --accent-ink: #141d26;
  --cable: #c43d0c;         /* cable + motion path in diagrams */
  --fig: #1d2833;
  --fig-far: #8f9ba7;
  --good: #1f7a4d;
  --warn: #9a5b00;
  --font-display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161b; --surface: #192027; --surface-2: #232c35; --ink: #e5e9ed; --muted: #95a1ad;
    --line: #2f3a45; --accent: #f5c02b; --accent-ink: #141d26; --cable: #ff7a45; --fig: #e5e9ed;
    --fig-far: #5f6c79; --good: #4cc38a; --warn: #f0b44c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161b; --surface: #192027; --surface-2: #232c35; --ink: #e5e9ed; --muted: #95a1ad;
  --line: #2f3a45; --accent: #f5c02b; --accent-ink: #141d26; --cable: #ff7a45; --fig: #e5e9ed;
  --fig-far: #5f6c79; --good: #4cc38a; --warn: #f0b44c; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cable); outline-offset: 2px; }

.shell { max-width: 880px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
  margin-inline: -16px; padding-inline: 16px; padding-block: 12px 0;
}
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: .02em; text-transform: uppercase; margin: 0; line-height: 1; }
.brand h1 span { background: var(--accent); color: var(--accent-ink); padding: 0 6px; border-radius: 3px; }
.save-status { font-size: 12px; color: var(--muted); }
nav.tabs { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; }
nav.tabs button {
  border: 0; background: none; padding: 8px 12px 10px; cursor: pointer; color: var(--muted);
  font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: .06em; text-transform: uppercase;
  border-bottom: 3px solid transparent; white-space: nowrap;
}
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

main { display: grid; gap: 20px; padding-top: 20px; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.05; margin: 0; text-wrap: balance; text-transform: uppercase; letter-spacing: .01em; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin: 0; letter-spacing: .02em; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }

.daychips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; cursor: pointer;
  font-size: 13px; font-weight: 600;
}
.chip-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip-btn.today::after { content: "•"; color: var(--cable); margin-left: 4px; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.pill.pulley { background: var(--accent); color: var(--accent-ink); }
.pill.done { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }

.ex-list { display: grid; gap: 10px; }
.ex-row {
  display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: center; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; cursor: pointer; width: 100%;
}
.ex-row:hover { border-color: var(--muted); }
.ex-row .info { min-width: 0; display: grid; gap: 4px; }
.ex-row .name { font-weight: 600; font-size: 16px; }
.ex-row .meta { font-size: 13px; color: var(--muted); }
.ex-row .order { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

.fig { display: block; width: 100%; height: auto; background: var(--surface-2); border-radius: 8px; }
.fig .floor { stroke: var(--muted); stroke-width: 2; }
.fig .tower { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.fig .tick { stroke: var(--line); stroke-width: 1.5; }
.fig .carriage { fill: var(--accent); stroke: var(--accent-ink); stroke-width: 1; }
.fig .pulley { fill: var(--surface); stroke: var(--fig); stroke-width: 2; }
.fig .guide { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 3 5; opacity: .9; }
.fig .cable { stroke: var(--cable); stroke-width: 2; }
.fig .handle { fill: var(--surface); stroke: var(--cable); stroke-width: 2.5; stroke-linejoin: round; }
.fig .bar-end { fill: var(--fig); stroke: var(--cable); stroke-width: 2.5; }
.fig .strand { stroke: var(--cable); stroke-width: 3; stroke-linecap: round; }
.fig .ball { fill: var(--cable); }

/* Attachment drawings */
.gear-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.gear-card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.gear-card svg { width: 100%; height: auto; max-height: 96px; }
.gear-card .nm { font-weight: 600; }
.gear-card .s { font-size: 12px; color: var(--muted); }
.gear-or { align-self: center; justify-self: center; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.gear-pick { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
.gear-pick .gear-card { flex: 1 1 180px; }
.gm { fill: none; stroke: var(--fig); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.gk { fill: none; stroke: var(--fig); stroke-width: 11; stroke-dasharray: 1.5 2.5; }
.gc { stroke: var(--muted); stroke-width: 2; }
.gclip { fill: none; stroke: var(--fig); stroke-width: 2.5; }
.grope { fill: none; stroke: var(--fig); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 5 2; }
.gball, .ggrip { fill: var(--fig); }
.fig .trail { fill: none; stroke: var(--cable); stroke-width: 1.5; stroke-dasharray: 2 4; opacity: .75; }
.fig .arrow { fill: var(--cable); }
.fig .limb { fill: none; stroke: var(--fig); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
.fig .limb.far { stroke: var(--fig-far); }
.fig .torso { fill: none; stroke: var(--fig); stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
.fig .torso-f { fill: var(--fig); stroke: var(--fig); stroke-width: 6; stroke-linejoin: round; }
.fig .head { fill: var(--fig); }
.fig .lbl { fill: var(--muted); font: 600 10px var(--font-body); letter-spacing: .06em; text-transform: uppercase; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.grid-lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.lib-card { display: grid; gap: 8px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; cursor: pointer; }
.lib-card:hover { border-color: var(--muted); }
.lib-card .name { font-weight: 600; }
.lib-card .meta { font-size: 13px; color: var(--muted); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--cable); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.icon-btn { border: 0; background: none; cursor: pointer; padding: 4px 8px; color: var(--muted); font-size: 16px; line-height: 1; border-radius: 6px; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 24px; text-align: center; color: var(--muted); }
.rest { padding: 32px 20px; }
.rest h3 { color: var(--ink); margin-bottom: 6px; }

/* Detail sheet */
dialog.sheet { border: 0; padding: 0; width: min(760px, 100%); max-height: 100%; background: var(--bg); color: var(--ink); border-radius: 14px; }
dialog.sheet::backdrop { background: rgb(0 0 0 / .5); }
.sheet-inner { padding: 18px 16px 24px; display: grid; gap: 18px; }
.sheet-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.fig-wrap { display: grid; gap: 8px; }
#sheetFig .fig { max-height: 46vh; }
.demo { justify-self: start; font-weight: 600; font-size: 14px; color: var(--ink); text-decoration: underline; text-decoration-color: var(--cable); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.fig-ctrl { display: flex; gap: 10px; align-items: center; }
.fig-ctrl input[type="range"] { flex: 1; accent-color: var(--cable); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.fact .k { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.fact .v { font-weight: 600; }
.fact .s { font-size: 13px; color: var(--muted); }
.fact.pulley-fact { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.fact.pulley-fact .k, .fact.pulley-fact .s { color: var(--accent-ink); opacity: .8; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.cols > div { min-width: 0; }
ol.steps, ul.cues { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 4px; }
.note-input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; }

.logger { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; }
.log-form { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
.log-form label { display: grid; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted); }
.log-form input { width: 96px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; font-family: var(--font-mono); font-size: 16px; }
.stepper { display: flex; align-items: center; gap: 2px; }
.stepper button { width: 34px; height: 40px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; cursor: pointer; font-weight: 700; }
.sets { display: flex; gap: 6px; flex-wrap: wrap; }
.set-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 4px 4px 10px; border-radius: 999px; background: var(--surface-2); font-family: var(--font-mono); font-size: 13px; }
.set-chip button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 6px; font-size: 14px; }
.hint { font-size: 14px; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); }
.hint b { font-family: var(--font-mono); }

/* Plan editor */
.plan-day { display: grid; gap: 10px; }
.plan-day .day-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.plan-day .day-head input { flex: 1; min-width: 140px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; font-weight: 600; }
.plan-item { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.plan-item .nm { min-width: 0; font-weight: 500; }
.plan-item .ctrls { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; justify-content: end; }
.plan-item input { width: 48px; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 4px 6px; font-family: var(--font-mono); text-align: center; }
.plan-item .x { color: var(--muted); font-size: 13px; }
.add-row select { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 8px; max-width: 100%; }

/* Progress */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.stat .v { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 12px; color: var(--muted); }
.heat-wrap { overflow-x: auto; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 14px); gap: 3px; width: max-content; }
.heat i { width: 14px; height: 14px; border-radius: 3px; background: var(--surface-2); display: block; }
.heat i.on { background: var(--cable); }
.heat i.now { outline: 2px solid var(--ink); outline-offset: -2px; }
.heat i.fut { background: transparent; }
.chart { width: 100%; height: auto; display: block; }
.chart .gridl { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font: 500 11px var(--font-mono); }
.chart .l1 { fill: none; stroke: var(--cable); stroke-width: 2.5; }
.chart .l2 { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
.chart .area { fill: var(--cable); opacity: .1; }
.chart .dot { fill: var(--cable); }
.chart .end { fill: var(--surface); stroke: var(--cable); stroke-width: 3; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 16px; height: 3px; vertical-align: middle; margin-right: 6px; background: var(--cable); }
.legend i.d { background: none; border-top: 2px dashed var(--muted); height: 0; }
.hist { display: grid; gap: 8px; }
.hist-day { border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 4px; }
.hist-day .d { font-weight: 600; }
.hist-day .e { font-size: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
.hist-day .e .n { min-width: 0; }
.select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; max-width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 14px; cursor: pointer; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); }

.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }

@media (max-width: 620px) {
  .ex-row { grid-template-columns: 96px 1fr; gap: 10px; }
  .cols { grid-template-columns: 1fr; }
  .gear-pick { flex-direction: column; }
  .gear-pick .gear-card { flex: none; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  h2 { font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; }
}
</style>

<div class="shell">
  <header class="top">
    <div class="brand">
      <h1>Cable <span>Workout</span> Log</h1>
      <div class="save-status" id="saveStatus">Loading your log…</div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" id="tab-today" data-tab="today" aria-selected="true">Today</button>
      <button role="tab" id="tab-plan" data-tab="plan" aria-selected="false">Plan</button>
      <button role="tab" id="tab-library" data-tab="library" aria-selected="false">Exercises</button>
      <button role="tab" id="tab-progress" data-tab="progress" aria-selected="false">Progress</button>
    </nav>
  </header>
  <main id="view"></main>
</div>

<dialog class="sheet" id="sheet" aria-label="Exercise detail"><div class="sheet-inner" id="sheetBody"></div></dialog>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ============================================================
   Exercise library
   Pose angles are degrees from straight down; positive = forward
   (side view) or outward (front view). a = start, b = end of the
   working phase.
   ============================================================ */
const FLOOR = 222;
const LEVELS = {
  low:   { y: 208, name: "Low",   where: "Lowest setting, about ankle height" },
  knee:  { y: 176, name: "Knee",  where: "About knee height" },
  waist: { y: 134, name: "Waist", where: "About hip / belt height" },
  chest: { y: 98,  name: "Chest", where: "About mid-chest height" },
  shoulder: { y: 84, name: "Shoulder", where: "About shoulder height" },
  head:  { y: 66,  name: "Head",  where: "About forehead height" },

};

const EX = [
  {
    id: "chest-press", name: "Standing cable chest press", group: "push",
    muscles: "Chest, front delts, triceps", level: "chest", attach: "2 D-handles",

  {

    muscles: "Lower chest, front delts", level: "high", attach: "2 D-handles",
    position: "Centered between the towers, one foot forward",
    view: "front", machine: "both", grip: "split",

    a: { f: 1, x: 175, anchor: "L", t: 8, aL: [-28, -18], aR: [-28, -18], lL: [18, 2], lR: [-18, -22] },

  {
    id: "front-raise", name: "Cable front raise", group: "push",
    muscles: "Front delts", level: "low", attach: "20\" straight bar",

    armL: p.hT ? reach(shL, p.hT) : arm(shL, p.aL, fL, p.sL),
    armR: p.hT ? reach(shR, p.hT) : arm(shR, p.aR, fR, p.sR),

  const lows = [pts.legL[2][1] + 4, pts.legR[2][1] + 4, pts.legL[1][1] + 5, pts.legR[1][1] + 5];
  const dy = FLOOR - Math.max(...lows);

  if (p.anchor === "L") dx = p.x - pts.legL[2][0];

}

    case "handR": return [hR];
    case "ankleL": return [pts.legL[2]];

const NS = "http://www.w3.org/2000/svg";

const diagrams = new Set();

  // height guide behind everything
  sv("line", { x1: ex.machine === "behind" ? 4 : 40, y1: lvl.y, x2: ex.machine === "both" ? 280 : 316, y2: lvl.y, class: "guide" }, svg);
  for (const tx of towers) {
    sv("rect", { x: tx, y: 24, width: 22, height: FLOOR - 24, rx: 3, class: "tower" }, svg);
    for (let y = 32; y <= 212; y += 9) sv("line", { x1: tx + 5, y1: y, x2: tx + 17, y2: y, class: "tick" }, svg);
    sv("rect", { x: tx - 2, y: lvl.y - 7, width: 26, height: 14, rx: 3, class: "carriage" }, svg);
  }
  sv("line", { x1: 0, y1: FLOOR, x2: 320, y2: FLOOR, class: "floor" }, svg);
  const label = sv("text", { x: ex.machine === "both" ? 160 : 314, y: 16, class: "lbl", "text-anchor": ex.machine === "both" ? "middle" : "end" }, svg);
  label.textContent = ({ front: "Front view", rear: "View from behind" }[ex.view] || "Side view") + " · pulley " + lvl.name;
  if (ex.pair) {
    const n = sv("text", { x: 314, y: 30, class: "lbl", "text-anchor": "end" }, svg);
    n.textContent = "Both pulleys · one shown";
  }

  // motion path of the grip
  const trailPts = [[], []];
  for (let i = 0; i <= 24; i++) {
    const g = gripPoints(ex, solve(poseAt(ex, i / 24)));

    parts.farArm = sv("polyline", { class: "limb far" }, g);

    parts.neck = sv("line", { class: "limb" }, g);
    parts.nearLeg = sv("polyline", { class: "limb" }, g);
  } else {
    parts.legL = sv("polyline", { class: "limb" }, g);
    parts.legR = sv("polyline", { class: "limb" }, g);
    parts.torsoF = sv("polygon", { class: "torso-f" }, g);
    parts.neck = sv("line", { class: "limb" }, g);
    parts.armL = sv("polyline", { class: "limb" }, g);
  }
  parts.head = sv("circle", { r: L.head, class: "head" }, g);
  parts.nearArm = sv("polyline", { class: "limb" }, g);
  const glyph = GEAR[ex.gear[0]].glyph;
  parts.handles = trailPts.filter(t => t.length).map(() => {
    const h = sv("g", {}, g);
    if (glyph === "rope") {
      for (const y of [-6, 6]) { sv("line", { x1: 0, y1: 0, x2: 12, y2: y, class: "strand" }, h); sv("circle", { cx: 13, cy: y * 1.1, r: 3.2, class: "ball" }, h); }
      sv("circle", { r: 2.5, class: "ball" }, h);

  for (const pp of pulleyPoints(ex)) sv("circle", { cx: pp[0], cy: pp[1], r: 5, class: "pulley" }, svg);
  for (const t of trailPts) {

    const ang = Math.atan2(y2 - y1, x2 - x1), s = 7;

    const r = [tip[0] - Math.cos(ang + 0.5) * s, tip[1] - Math.sin(ang + 0.5) * s];

function setLine(n, a, b) { n.setAttribute("x1", a[0]); n.setAttribute("y1", a[1]); n.setAttribute("x2", b[0]); n.setAttribute("y2", b[1]); }
function drawDiagram(d, k) {

  const pulleys = pulleyPoints(ex);
  parts.cables.forEach((c, i) => { const pp = pulleys[Math.min(i, pulleys.length - 1)]; setLine(c, [pp[0] + 2, pp[1]], grips[Math.min(i, grips.length - 1)]); });
  if (!pts.front) {
    parts.farLeg.setAttribute("points", P(pts.legR));
    parts.farArm.setAttribute("points", P(pts.armR));
    parts.torso.setAttribute("points", P([pts.hip, pts.mid, pts.sh]));
    setLine(parts.neck, pts.sh, pts.neckEnd);
    parts.nearLeg.setAttribute("points", P(pts.legL));
    parts.nearArm.setAttribute("points", P(pts.armL));
  } else {
    parts.legL.setAttribute("points", P(pts.legL));
    parts.legR.setAttribute("points", P(pts.legR));
    parts.torsoF.setAttribute("points", P([pts.shL, pts.shR, pts.legR[0], pts.legL[0]]));
    setLine(parts.neck, pts.sh, pts.neckEnd);
    parts.armL.setAttribute("points", P(pts.armL));
    parts.nearArm.setAttribute("points", P(pts.armR));

  parts.head.setAttribute("cx", pts.head[0]); parts.head.setAttribute("cy", pts.head[1]);
  parts.handles.forEach((h, i) => {
    const pp = pulleys[Math.min(i, pulleys.length - 1)], q = grips[i];
    const ang = Math.atan2(q[1] - pp[1], q[0] - pp[0]) * 180 / Math.PI;
    h.setAttribute("transform", `translate(${q[0].toFixed(1)},${q[1].toFixed(1)}) rotate(${ang.toFixed(1)})`);

}

// Tempo: 1.1 s lift, 0.35 s hold, 1.6 s lower, 0.45 s pause.
const T_UP = 1100, T_HOLD = 350, T_DOWN = 1600, T_REST = 450, CYCLE = T_UP + T_HOLD + T_DOWN + T_REST;

function mountDiagrams(root) {

/* ============================================================
   Storage: per-person cloud store when available, else this browser
   ============================================================ */
const LS_KEY = "cable-workout-log-v1";
const Store = {
  mode: "loading", db: null, uid: null,
  state: { units: "kg", plan: clone(DEFAULT_PLAN), notes: {} },
  logs: {},
  timers: {}, chains: {},
  async init() {
    let db = null, user = null;
    if (window.claude && typeof window.claude.use === "function") {
      try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) { db = null; }
    }
    const uid = user ? await user.id() : null;
    if (db && uid) {
      try {
        const snap = await db.collection("data/users/" + uid).get();
        for (const doc of snap.docs) {
          const data = doc.data();
          if (doc.id === "state") this.state = normalizeState(data);
          else if (doc.id.startsWith("log-")) this.logs[doc.id.slice(4)] = clone(data);
        }
        this.db = db; this.uid = uid; this.mode = "cloud";
        return;
      } catch (e) { /* fall through to local */ }
    }
    this.mode = "local";
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) { const o = JSON.parse(raw); this.state = normalizeState(o.state || {}); this.logs = o.logs || {}; }
    } catch (e) { this.mode = "memory"; }
  },
  saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ state: this.state, logs: this.logs })); }
    catch (e) { this.mode = "memory"; updateStatus(); }
  },
  write(docId, body) {
    if (this.mode !== "cloud") { this.saveLocal(); return; }
    clearTimeout(this.timers[docId]);
    setStatus("Saving…");
    this.timers[docId] = setTimeout(() => {
      const ref = this.db.doc("data/users/" + this.uid + "/" + docId);
      const job = () => (body() ? ref.set(body()) : ref.delete());
      this.chains[docId] = (this.chains[docId] || Promise.resolve())
        .then(job)
        .then(() => setStatus("Saved"))
        .catch(err => {
          setStatus("Not saved");
          toast(err && err.code === "quota_exceeded" ? "Storage is full. Export a backup and delete old history." : "Couldn't save that change. Check your connection and try again.");
        });
    }, 500);
  },
  saveState() { this.write("state", () => clone(this.state)); },
  saveLog(date) {
    const log = this.logs[date];
    if (log && !Object.keys(log.sets).length) delete this.logs[date];
    this.write("log-" + date, () => (this.logs[date] ? clone(this.logs[date]) : null));
  },
};
function normalizeState(s) {
  const plan = s.plan && typeof s.plan === "object" ? s.plan : clone(DEFAULT_PLAN);
  for (const day of Object.values(plan)) {
    if (!day || !Array.isArray(day.items)) continue;
    const seen = new Set();
    day.items = day.items.map(x => (x.id in RETIRED ? (RETIRED[x.id] ? { ...x, id: RETIRED[x.id] } : null) : x))
      .filter(x => x && EXMAP[x.id] && !seen.has(x.id) && seen.add(x.id));
  }
  return { units: s.units === "lb" ? "lb" : "kg", plan, notes: s.notes || {} };
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dateKey = d => { const z = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; };

const dayIdOf = d => ["sun", "mon", "tue", "wed", "thu", "fri", "sat"][d.getDay()];
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const fmtDate = (k, opts = { weekday: "short", month: "short", day: "numeric" }) => parseKey(k).toLocaleDateString(undefined, opts);

const inc = () => (unit() === "lb" ? 5 : 2.5);

function planItemFor(exId) {
  for (const [id] of DAYS) { const f = (Store.state.plan[id]?.items || []).find(x => x.id === exId); if (f) return f; }
  return { id: exId, sets: 3, min: 8, max: 12 };

  const item = planItemFor(exId), last = lastSession(exId);

  const top = Math.max(...last.sets.map(s => s.w));
  const topSets = last.sets.filter(s => s.w === top);
  const hitAll = last.sets.length >= item.sets && topSets.every(s => s.r >= item.max);
  if (hitAll) return { text: `You hit ${item.max} reps on every set last time. Go up to <b>${fmtW(top + inc())} ${unit()}</b>.`, w: top + inc() };

    }).join("");
    return `<div class="card plan-day">
      <div class="day-head"><h3 style="min-width:96px">${nm}</h3><input id="title-${id}" value="${esc(d.title)}" data-title="${id}" aria-label="${nm} workout name" placeholder="Rest"></div>
      ${rows || `<div class="muted" style="font-size:14px">Rest day. Add an exercise to train.</div>`}
      <div class="row add-row"><select id="add-${id}" aria-label="Exercise to add to ${nm}">${opts}</select><button class="btn small" data-add="${id}">Add</button></div>
    </div>`;
  }).join("");
  return `
    <section class="stack">
      <div class="eyebrow">Weekly plan</div>
      <h2>Your week</h2>
      <p class="muted" style="margin:0">Set what you train each day and your rep range. When you hit the top of the range on every set, the app tells you to add weight.</p>
    </section>
    <section class="stack">${days}</section>
    <section class="row">${ui.confirm === "reset"
      ? `<div class="confirm">Replace your plan with the starter plan? Your logged sets stay. <button class="btn small danger" data-act="reset-yes">Replace plan</button><button class="btn small" data-act="cancel">Keep mine</button></div>`
      : `<button class="btn" data-act="reset">Reset to starter plan</button>`}</section>`;
}

function weekStart(d) { const x = new Date(d); const off = (x.getDay() + 6) % 7; x.setDate(x.getDate() - off); x.setHours(0, 0, 0, 0); return x; }
function viewProgress() {
  const dates = Object.keys(Store.logs).filter(d => Object.keys(Store.logs[d].sets).length).sort();
  const ws = dateKey(weekStart(new Date()));
  const thisWeek = dates.filter(d => d >= ws);
  let setsWeek = 0, volWeek = 0;
  for (const d of thisWeek) for (const arr of Object.values(Store.logs[d].sets)) for (const s of arr) { setsWeek++; volWeek += s.w * s.r; }
  // streak in weeks with at least one workout
  const hasWeek = c => { const a = dateKey(c), e = new Date(c); e.setDate(e.getDate() + 7); const b = dateKey(e); return dates.some(d => d >= a && d < b); };
  let streak = 0; const cur = weekStart(new Date());
  if (!hasWeek(cur)) cur.setDate(cur.getDate() - 7);   // this week isn't over yet
  while (hasWeek(cur)) { streak++; cur.setDate(cur.getDate() - 7); }
  // heat map: last 16 weeks
  const start = weekStart(new Date()); start.setDate(start.getDate() - 7 * 15);
  const tk = todayKey(); let cells = "";
  for (let i = 0; i < 16 * 7; i++) { const d = new Date(start); d.setDate(d.getDate() + i); const k = dateKey(d);
    cells += `<i class="${k > tk ? "fut" : dates.includes(k) ? "on" : ""} ${k === tk ? "now" : ""}" title="${k}"></i>`; }
  const logged = EX.filter(e => dates.some(d => setsOn(d, e.id).length));
  if (!ui.chartEx || !logged.find(e => e.id === ui.chartEx)) ui.chartEx = logged[0]?.id || null;
  const hist = dates.slice(-12).reverse().map(d => `<div class="hist-day"><div class="d">${fmtDate(d)}</div>${Object.entries(Store.logs[d].sets).map(([id, arr]) =>
    `<div class="e"><span class="n">${esc(EXMAP[id]?.name || id)}</span><span class="num muted">${arr.map(s => `${fmtW(s.w)}×${s.r}`).join("  ")}</span></div>`).join("")}</div>`).join("");
  return `
    <section class="stack"><div class="eyebrow">Progress</div><h2>How it's going</h2></section>
    <section class="stats">
      <div class="stat"><div class="v">${thisWeek.length}</div><div class="k">workouts this week</div></div>
      <div class="stat"><div class="v">${setsWeek}</div><div class="k">sets this week</div></div>
      <div class="stat"><div class="v">${Math.round(volWeek).toLocaleString()}</div><div class="k">${unit()} lifted this week</div></div>
      <div class="stat"><div class="v">${streak}</div><div class="k">week streak</div></div>
    </section>
    <section class="card stack">
      <div class="row" style="justify-content:space-between"><h3>Last 16 weeks</h3><span class="muted" style="font-size:13px">${dates.length} workout${dates.length === 1 ? "" : "s"} logged</span></div>
      <div class="heat-wrap"><div class="heat" aria-label="Workout days">${cells}</div></div>
    </section>
    <section class="card stack">
      <div class="row" style="justify-content:space-between">
        <h3>Strength over time</h3>
        ${logged.length ? `<select class="select" id="chartEx" aria-label="Exercise">${logged.map(e => `<option value="${e.id}" ${e.id === ui.chartEx ? "selected" : ""}>${esc(e.name)}</option>`).join("")}</select>` : ""}
      </div>
      ${logged.length ? `<div id="chartBox"></div><div class="legend"><span><i></i>Heaviest set</span><span><i class="d"></i>Estimated 1-rep max</span></div>`
        : `<div class="empty">Your chart appears here after your first logged set. Open any exercise from Today and tap <b>Log set</b>.</div>`}
    </section>
    ${hist ? `<section class="card stack"><h3>Recent workouts</h3><div class="hist">${hist}</div></section>` : ""}
    <section class="card stack">
      <h3>Settings & backup</h3>
      <div class="row"><span>Weight units</span><span class="seg"><button data-units="kg" aria-pressed="${unit() === "kg"}">kg</button><button data-units="lb" aria-pressed="${unit() === "lb"}">lb</button></span>
        <span class="muted" style="font-size:13px">Changes the label only. Numbers aren't converted.</span></div>
      <div class="row"><button class="btn small" data-act="export">Export backup (.json)</button>
        <label class="btn small" for="importFile">Import backup</label><input type="file" id="importFile" accept=".json,application/json" hidden></div>
      ${ui.confirm && ui.confirm.import ? `<div class="confirm">Replace everything here with the backup (${ui.confirm.import.days} workout days)? <button class="btn small danger" data-act="import-yes">Replace</button><button class="btn small" data-act="cancel">Cancel</button></div>` : ""}
      <div class="muted" style="font-size:13px">${{ cloud: "Your log is saved to your Claude account, private to you.", local: "Your log is saved in this browser only. Export a backup now and then.", memory: "This browser is blocking storage, so nothing is saved. Export before closing.", loading: "Loading…" }[Store.mode]}</div>
    </section>`;
}

function drawChart() {
  const box = document.getElementById("chartBox"); if (!box || !ui.chartEx) return;
  const pts = Object.keys(Store.logs).sort().map(d => ({ d, s: setsOn(d, ui.chartEx) })).filter(x => x.s.length)
    .map(x => ({ d: x.d, top: Math.max(...x.s.map(s => s.w)), est: Math.max(...x.s.map(s => e1rm(s.w, s.r))) }));
  const W = 640, H = 240, ml = 44, mr = 16, mt = 14, mb = 28;
  const lo0 = Math.min(...pts.map(p => p.top)), hi0 = Math.max(...pts.map(p => p.est));
  const span = Math.max(hi0 - lo0, 1);
  const step = [1, 2, 2.5, 5, 10, 20, 25, 50, 100].find(s => span / s <= 5) || 100;
  const lo = Math.max(0, Math.floor((lo0 - span * 0.1) / step) * step), hi = Math.ceil((hi0 + span * 0.1) / step) * step;
  const x = i => pts.length === 1 ? (ml + W - mr) / 2 : ml + (W - ml - mr) * i / (pts.length - 1);
  const y = v => mt + (H - mt - mb) * (1 - (v - lo) / (hi - lo));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Heaviest set per workout">`;
  for (let v = lo; v <= hi + 1e-9; v += step) s += `<line class="gridl" x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${ml - 8}" y="${y(v) + 4}" text-anchor="end">${fmtW(v)}</text>`;
  const idx = pts.length <= 4 ? pts.map((_, i) => i) : [0, Math.round((pts.length - 1) / 2), pts.length - 1];
  for (const i of idx) s += `<text class="axis" x="${x(i)}" y="${H - 8}" text-anchor="${pts.length === 1 ? "middle" : i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle"}">${fmtDate(pts[i].d, { month: "short", day: "numeric" })}</text>`;
  const line = k => pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[k]).toFixed(1)}`).join("");
  if (pts.length > 1) s += `<path class="area" d="${line("top")}L${x(pts.length - 1)},${H - mb}L${x(0)},${H - mb}Z"/>`;
  s += `<path class="l2" d="${line("est")}"/><path class="l1" d="${line("top")}"/>`;
  pts.forEach((p, i) => { s += i === pts.length - 1 ? `<circle class="end" cx="${x(i)}" cy="${y(p.top)}" r="5"/>` : `<circle class="dot" cx="${x(i)}" cy="${y(p.top)}" r="3"/>`; });
  const lp = pts[pts.length - 1];
  s += `</svg><div class="muted" style="font-size:13px">Latest: <span class="num">${fmtW(lp.top)} ${unit()}</span> heaviest set, about <span class="num">${fmtW(Math.round(lp.est))} ${unit()}</span> estimated 1-rep max.${pts.length > 1 ? ` Change since first workout: <span class="num">${lp.top - pts[0].top >= 0 ? "+" : ""}${fmtW(lp.top - pts[0].top)} ${unit()}</span>.` : ""}</div>`;
  box.innerHTML = s;
}

/* ============================================================
   Exercise detail sheet
   ============================================================ */
let sheetEx = null, sheetDiagram = null;
function openSheet(id) {
  sheetEx = EXMAP[id]; if (!sheetEx) return;
  renderSheet();
  const dlg = document.getElementById("sheet");
  if (!dlg.open) dlg.showModal();
}
function renderSheet() {
  const ex = sheetEx, item = planItemFor(ex.id), lvl = LEVELS[ex.level];
  const today = setsOn(todayKey(), ex.id), last = lastSession(ex.id), sug = suggestion(ex.id);
  const prefillW = today.length ? today[today.length - 1].w : (sug.w ?? "");
  const prefillR = today.length ? today[today.length - 1].r : item.max;
  const body = document.getElementById("sheetBody");
  body.innerHTML = `
    <div class="sheet-head">
      <div class="stack" style="gap:4px"><div class="eyebrow">${GROUPS[ex.group]} · ${esc(ex.muscles)}</div><h2>${esc(ex.name)}</h2></div>
      <button class="icon-btn" data-act="close" aria-label="Close" style="font-size:22px">✕</button>
    </div>
    <div class="fig-wrap">
      <div id="sheetFig"></div>
      <div class="fig-ctrl">
        <button class="btn small" id="playBtn" data-act="play">${reduceMotion.matches ? "Play" : "Pause"}</button>
        <input type="range" id="scrub" min="0" max="100" value="0" aria-label="Scrub through the movement">
        <span class="muted" style="font-size:12px;white-space:nowrap">start → finish</span>
      </div>
      <a class="demo" href="https://www.youtube.com/results?search_query=${encodeURIComponent(ex.name + " cable exercise proper form")}" target="_blank" rel="noopener">Watch a demo on YouTube ↗</a>
    </div>
    <div class="facts">
      <div class="fact pulley-fact"><div class="k">Pulley height</div><div class="v">${lvl.name}</div><div class="s">${lvl.where}</div></div>
      <div class="fact"><div class="k">Where you stand</div><div class="v" style="font-weight:500">${esc(ex.position)}</div></div>
    </div>
    <section class="stack" style="gap:8px" aria-label="Attachment">
      <div class="eyebrow">Clip on${ex.gear.length > 1 ? " either" : ""}${ex.gear[0] === "dhandle" && (ex.pair || ex.machine === "both") ? " · one on each cable" : ""}</div>
      <div class="gear-pick">${ex.gear.map(g => gearCard(g)).join('<span class="gear-or">or</span>')}</div>
    </section>
    <div class="stack" style="gap:6px">
      <label for="noteInput" class="eyebrow">Setting on your machine</label>
      <input id="noteInput" class="note-input" maxlength="40" placeholder="e.g. position 6 of 32" value="${esc(Store.state.notes[ex.id] || "")}">
    </div>
    <section class="logger" aria-label="Log sets">
      <div class="row" style="justify-content:space-between"><h3>Log today</h3><span class="pill">${item.sets} × ${item.min}–${item.max} reps</span></div>
      <div class="muted" style="font-size:13px">Log the number on the weight-stack pin. The Arcadia is 2:1, so the cable feels like about half of that.</div>
      <div class="hint">${sug.text}${last ? ` <span class="muted">Last time: <span class="num">${last.sets.map(s => `${fmtW(s.w)}×${s.r}`).join(", ")}</span></span>` : ""}</div>
      <form class="log-form" id="logForm">
        <label>Weight (${unit()})<span class="stepper"><button type="button" data-step="w:-1" aria-label="Less weight">−</button><input id="wIn" type="number" inputmode="decimal" step="any" min="0" value="${prefillW}" required><button type="button" data-step="w:1" aria-label="More weight">+</button></span></label>
        <label>Reps<span class="stepper"><button type="button" data-step="r:-1" aria-label="Fewer reps">−</button><input id="rIn" type="number" inputmode="numeric" min="1" max="100" value="${prefillR}" required><button type="button" data-step="r:1" aria-label="More reps">+</button></span></label>
        <button class="btn primary" type="submit">Log set</button>
      </form>
      <div class="sets">${today.length ? today.map((s, i) => `<span class="set-chip">${i + 1}: ${fmtW(s.w)} ${unit()} × ${s.r}<button data-delset="${i}" aria-label="Delete set ${i + 1}">✕</button></span>`).join("") : `<span class="muted" style="font-size:14px">No sets yet today.</span>`}</div>
    </section>
    <div class="cols">
      <div><h3>Setup</h3><ol class="steps">${ex.setup.map(s => `<li>${esc(s)}</li>`).join("")}</ol></div>
      <div><h3>The movement</h3><ol class="steps">${ex.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol></div>
      <div><h3>Cues</h3><ul class="cues">${ex.cues.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>
      <div><h3>Common mistakes</h3><ul class="cues">${ex.mistakes.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>
    </div>`;
  const wasManual = sheetDiagram ? sheetDiagram.manual : reduceMotion.matches;
  sheetDiagram = makeDiagram(ex, { manual: wasManual });
  document.getElementById("sheetFig").appendChild(sheetDiagram.svg);
  const scrub = document.getElementById("scrub");
  sheetDiagram.onFrame = k => { scrub.value = Math.round(k * 100); };
  document.getElementById("playBtn").textContent = sheetDiagram.manual ? "Play" : "Pause";
  scrub.value = Math.round(sheetDiagram.k * 100);
}

/* ============================================================
   Events
   ============================================================ */
document.querySelector("nav.tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  ui.tab = b.dataset.tab; ui.confirm = null;
  try { localStorage.setItem(LS_KEY + ":tab", ui.tab); } catch (err) {}
  render(); window.scrollTo(0, 0);
});

const view = document.getElementById("view");
view.addEventListener("click", e => {
  const t = e.target.closest("button, [data-open]"); if (!t) return;
  const ds = t.dataset;
  if (ds.open) return openSheet(ds.open);
  if (ds.day) { ui.day = ds.day; return render(); }
  if (ds.group) { ui.group = ds.group; return render(); }
  const plan = Store.state.plan;
  if (ds.add) {
    const sel = document.getElementById("add-" + ds.add);
    plan[ds.add] = plan[ds.add] || { title: "", items: [] };
    plan[ds.add].items.push({ ...planItemFor(sel.value), id: sel.value });
    if (!plan[ds.add].title || plan[ds.add].title === "Rest") plan[ds.add].title = "Workout";
    Store.saveState(); return render();
  }
  if (ds.remove) { const [d, i] = ds.remove.split(":"); plan[d].items.splice(+i, 1); Store.saveState(); return render(); }
  if (ds.move) { const [d, i, dir] = ds.move.split(":"); const a = plan[d].items, j = +i + +dir; [a[i], a[j]] = [a[j], a[i]]; Store.saveState(); return render(); }
  if (ds.units) { Store.state.units = ds.units; Store.saveState(); return render(); }
  switch (ds.act) {
    case "reset": ui.confirm = "reset"; return render();
    case "reset-yes": Store.state.plan = clone(DEFAULT_PLAN); ui.confirm = null; Store.saveState(); toast("Plan reset to the starter plan"); return render();
    case "cancel": ui.confirm = null; return render();
    case "export": return exportData();
    case "import-yes": return applyImport();
  }
});
view.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.pi) {
    const [d, i, f] = t.dataset.pi.split(":"); const item = Store.state.plan[d].items[+i];
    const v = Math.max(1, Math.min(50, parseInt(t.value, 10) || 1)); item[f] = v;
    if (item.min > item.max) { if (f === "min") item.max = item.min; else item.min = item.max; }
    Store.saveState(); return render();
  }
  if (t.dataset.title) { Store.state.plan[t.dataset.title].title = t.value.trim().slice(0, 40); Store.saveState(); return; }
  if (t.id === "chartEx") { ui.chartEx = t.value; return drawChart(); }
  if (t.id === "importFile" && t.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const o = JSON.parse(r.result);
        if (!o || typeof o !== "object" || !o.logs || !o.state) throw 0;
        ui.confirm = { import: { data: o, days: Object.keys(o.logs).length } }; render();
      } catch (err) { toast("That file isn't a Cable Workout Log backup."); }
    };
    r.readAsText(t.files[0]);
  }
});

async function exportData() {
  const data = JSON.stringify({ app: "cable-workout-log", version: 1, exported: new Date().toISOString(), state: Store.state, logs: Store.logs }, null, 2);
  const filename = `cable-workout-backup-${todayKey()}.json`;
  let dl = null;
  if (window.claude && typeof window.claude.use === "function") { try { dl = await window.claude.use("downloads"); } catch (e) {} }
  if (dl) {
    try { await dl.save({ filename, data }); } catch (e) { if (e && e.code !== "declined") toast("Couldn't save the backup file here."); }
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}
function applyImport() {
  const o = ui.confirm.import.data; ui.confirm = null;
  const old = Object.keys(Store.logs);
  Store.state = normalizeState(o.state); Store.logs = {};
  for (const [d, log] of Object.entries(o.logs)) if (/^\d{4}-\d{2}-\d{2}$/.test(d) && log && log.sets) Store.logs[d] = { date: d, sets: log.sets };
  Store.saveState();
  for (const d of new Set([...old, ...Object.keys(Store.logs)])) Store.saveLog(d);
  toast("Backup imported"); render();
}

const sheet = document.getElementById("sheet");
sheet.addEventListener("click", e => {
  if (e.target === sheet) return sheet.close();
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.act === "close") return sheet.close();
  if (t.dataset.act === "play") {
    sheetDiagram.manual = !sheetDiagram.manual; t.textContent = sheetDiagram.manual ? "Play" : "Pause";
    if (!sheetDiagram.manual && reduceMotion.matches) {
      // Reduced motion: step through manually instead of looping.
      sheetDiagram.manual = true; t.textContent = "Play";
      const target = sheetDiagram.k < 0.5 ? 1 : 0; drawDiagram(sheetDiagram, target); document.getElementById("scrub").value = target * 100;
    }
    return;
  }
  if (t.dataset.step) {
    const [f, dir] = t.dataset.step.split(":"); const inp = document.getElementById(f === "w" ? "wIn" : "rIn");
    const cur = parseFloat(inp.value) || 0; const nv = Math.max(f === "w" ? 0 : 1, cur + (+dir) * (f === "w" ? inc() : 1));
    inp.value = fmtW(nv); return;
  }
  if (t.dataset.delset !== undefined) {
    const d = todayKey(); setsOn(d, sheetEx.id).splice(+t.dataset.delset, 1);
    if (!setsOn(d, sheetEx.id).length && Store.logs[d]) delete Store.logs[d].sets[sheetEx.id];
    Store.saveLog(d); renderSheet(); render(); return;
  }
});
sheet.addEventListener("input", e => {
  if (e.target.id === "scrub") { sheetDiagram.manual = true; document.getElementById("playBtn").textContent = "Play"; drawDiagram(sheetDiagram, e.target.value / 100); }
});
sheet.addEventListener("change", e => {
  if (e.target.id === "noteInput") {
    const v = e.target.value.trim().slice(0, 40);
    if (v) Store.state.notes[sheetEx.id] = v; else delete Store.state.notes[sheetEx.id];
    Store.saveState(); render();
  }
});
sheet.addEventListener("submit", e => {
  e.preventDefault();
  const w = parseFloat(document.getElementById("wIn").value), r = parseInt(document.getElementById("rIn").value, 10);
  if (!(w >= 0) || !(r >= 1)) { toast("Enter a weight and at least 1 rep."); return; }
  const d = todayKey();
  Store.logs[d] = Store.logs[d] || { date: d, sets: {} };
  (Store.logs[d].sets[sheetEx.id] = Store.logs[d].sets[sheetEx.id] || []).push({ w, r });
  Store.saveLog(d);
  const n = setsOn(d, sheetEx.id).length, target = planItemFor(sheetEx.id).sets;
  toast(n >= target ? `Set ${n} logged. That's all ${target} sets.` : `Set ${n} of ${target} logged`);
  renderSheet(); render();
});

/* ============================================================
   Boot
   ============================================================ */
render();
Store.init().then(() => { updateStatus(); render(); });
</script>
